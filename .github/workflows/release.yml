name: draft-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: Build without a release or create a draft release
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - draft
      version:
        description: Application version to build
        required: true
        default: "0.2.0"

permissions:
  contents: write

env:
  APP_VERSION: "0.2.0"
  NODE_VERSION: "24.18.0"

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.12.3" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "24.18.0" }
      - name: Validate release source, mode, tag, and metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python scripts/check-version.py
          if ($version -ne $env:APP_VERSION) { throw "Unexpected release version: $version" }
          $mode = if ($env:GITHUB_EVENT_NAME -eq "push") { "draft" } else { "${{ inputs.mode }}" }
          $requestedVersion = if ($env:GITHUB_EVENT_NAME -eq "push") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "${{ inputs.version }}" }
          if ($requestedVersion -ne $version) { throw "Requested version $requestedVersion does not match application version $version" }
          $tag = "v$version"
          if ($env:GITHUB_EVENT_NAME -eq "push") { python scripts/check-version.py --tag $env:GITHUB_REF_NAME | Out-Null }
          git fetch origin main --no-tags
          $contained = git branch -r --contains $env:GITHUB_SHA
          if (-not ($contained | Select-String -SimpleMatch "origin/main")) { throw "Release commit must be contained in origin/main" }
          if ($mode -eq "draft") {
            gh release view $tag --json isDraft,isPrerelease 2>$null | Out-Null
            $releaseExists = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
            if ($releaseExists) { throw "A draft or published release already exists for $tag" }
          }
          "RELEASE_MODE=$mode" | Add-Content $env:GITHUB_ENV
          "RELEASE_TAG=$tag" | Add-Content $env:GITHUB_ENV
      - name: Install build dependencies
        shell: pwsh
        run: |
          uv sync --locked --extra dev
          npm.cmd --prefix dashboard/web ci
          npm.cmd --prefix dashboard/web run check
          npm.cmd --prefix dashboard/web run build
      - name: Install and package pinned runtimes
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\playwright
        run: |
          uv run playwright install chromium
          $python = (Get-Command python).Source
          $pythonRoot = Split-Path $python -Parent
          $node = (Get-Command node).Source
          $nodeRoot = Split-Path $node -Parent
          $hermes = Join-Path $env:RUNNER_TEMP "hermes-build"
          & $python -m venv $hermes
          & (Join-Path $hermes "Scripts\python.exe") -m pip install "hermes-agent==0.13.0" "aiohttp==3.13.3"
          & $python scripts/assemble-release.py --output "$env:RUNNER_TEMP\dashboard-bundle" --python-runtime $pythonRoot --node-runtime $nodeRoot --hermes-runtime $hermes --playwright-browsers $env:PLAYWRIGHT_BROWSERS_PATH
      - name: Build offline Setup.exe
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler ISCC.exe is not available on the runner" }
          & $iscc "/DBundleDir=$env:RUNNER_TEMP\dashboard-bundle" "/O$env:RUNNER_TEMP\setup" scripts/UniversalDashboardAgent.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
      - name: Silent Setup.exe install, upgrade, smoke test, and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\setup\*.exe" | Select-Object -First 1
          $install = "$env:RUNNER_TEMP\dashboard-agent"
          $installLog = "$env:RUNNER_TEMP\setup-install.log"
          $installProcess = Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$install", "/LOG=$installLog") -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Silent installation failed with exit code $($installProcess.ExitCode)" }
          New-Item -ItemType Directory -Force "$install\.hermes-data" | Out-Null
          "synthetic-preserved-auth-state" | Set-Content "$install\.hermes-data\acceptance-marker.txt"
          '{"schema_version":1,"projects":[]}' | Set-Content "$install\projects.json"
          $upgradeProcess = Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$install", "/LOG=$env:RUNNER_TEMP\setup-upgrade.log") -Wait -PassThru
          if ($upgradeProcess.ExitCode -ne 0) { throw "Silent upgrade failed with exit code $($upgradeProcess.ExitCode)" }
          if (-not (Test-Path "$install\.hermes-data\acceptance-marker.txt")) { throw "Upgrade did not preserve Hermes authentication state" }
          if (-not (Test-Path "$install\projects.json")) { throw "Upgrade did not preserve the local project registry" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$install\scripts\smoke-test-install.ps1" -InstallDir $install
          $bundle = "$env:RUNNER_TEMP\dashboard-bundle"
          $manifestPath = "$bundle\manifest.sha256"
          $wheel = Get-ChildItem "$bundle\wheels\universal_dashboard_agent-*.whl" | Select-Object -First 1
          $wheelBytes = [IO.File]::ReadAllBytes($wheel.FullName)
          $manifestText = Get-Content $manifestPath -Raw
          try {
            [IO.File]::WriteAllText($wheel.FullName, "synthetic-invalid-wheel")
            $relative = $wheel.FullName.Substring($bundle.Length + 1).Replace('\', '/')
            $badHash = (Get-FileHash $wheel.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $updated = (Get-Content $manifestPath) | ForEach-Object { if ($_ -match "  $([regex]::Escape($relative))$") { "$badHash  $relative" } else { $_ } }
            $updated | Set-Content $manifestPath
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$bundle\scripts\install-windows.ps1" -BundleDir $bundle -InstallDir $install
            if ($LASTEXITCODE -eq 0) { throw "Synthetic failed upgrade unexpectedly succeeded" }
            if (-not (Test-Path "$install\.hermes-data\acceptance-marker.txt")) { throw "Failed upgrade did not restore the previous installation" }
            if (Test-Path "$install.upgrade-backup") { throw "Failed upgrade left a backup directory behind" }
          } finally {
            [IO.File]::WriteAllBytes($wheel.FullName, $wheelBytes)
            [IO.File]::WriteAllText($manifestPath, $manifestText)
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$install\scripts\uninstall-windows.ps1" -InstallDir $install -ConfirmUninstall
      - name: Scan bundle and create release metadata
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP\dashboard-bundle"
          $setup = Get-ChildItem "$env:RUNNER_TEMP\setup\*.exe" | Select-Object -First 1
          if ($setup.Length -ge 2GB) { throw "Setup.exe exceeds GitHub's 2 GiB asset limit" }
          $textExtensions = @('.bat', '.cmd', '.css', '.env', '.html', '.ini', '.iss', '.js', '.json', '.jsx', '.md', '.ps1', '.py', '.scss', '.svg', '.toml', '.ts', '.tsx', '.txt', '.xml', '.yaml', '.yml')
          $textFiles = Get-ChildItem $bundle -Recurse -File | Where-Object { $textExtensions -contains $_.Extension.ToLowerInvariant() -or $_.Name -in @('manifest.sha256', 'package-lock.json') }
          $secretMatches = $textFiles | Select-String -Pattern 'sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'
          if ($secretMatches) {
            $secretMatches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber)" }
            throw "Secret-like content found in release text files"
          }
          $pythonVersion = python -c "import platform; print(platform.python_version())"
          $nodeVersion = node -p "process.versions.node"
          $playwrightVersion = uv run python -c "import importlib.metadata; print(importlib.metadata.version('playwright'))"
          $chromiumVersion = (Get-ChildItem "$bundle\runtime\playwright" -Directory | Select-Object -ExpandProperty Name) -join ','
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $installerVersion = (Get-Item $iscc).VersionInfo.ProductVersion
          python scripts/write-release-manifest.py --version $env:APP_VERSION --setup $setup.FullName --bundle $bundle --output "$env:RUNNER_TEMP\release-manifest.json" --python-version $pythonVersion --node-version $nodeVersion --hermes-version "0.13.0" --playwright-version $playwrightVersion --chromium-version $chromiumVersion --installer-version "Inno Setup $installerVersion"
          Get-FileHash $setup.FullName -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($setup.Name)" } | Set-Content "$env:RUNNER_TEMP\SHA256SUMS.txt"
      - name: Upload tested release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDashboardAgent-${{ env.APP_VERSION }}-windows-x64
          path: |
            ${{ runner.temp }}\setup\*.exe
            ${{ runner.temp }}\SHA256SUMS.txt
            ${{ runner.temp }}\release-manifest.json
            ${{ runner.temp }}\setup-install.log
            ${{ runner.temp }}\setup-upgrade.log
          if-no-files-found: error
          retention-days: 14
      - name: Write sanitized workflow diagnostics
        if: always()
        shell: pwsh
        run: |
          $diagnostics = @{
            schema_version = 1
            run_id = "$env:GITHUB_RUN_ID"
            run_attempt = "$env:GITHUB_RUN_ATTEMPT"
            commit = "$env:GITHUB_SHA"
            version = "$env:APP_VERSION"
            mode = "$env:RELEASE_MODE"
          }
          $diagnostics | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\workflow-diagnostics.json"
      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\workflow-diagnostics.json
            ${{ runner.temp }}\setup-install.log
            ${{ runner.temp }}\setup-upgrade.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Create draft GitHub Release
        if: env.RELEASE_MODE == 'draft'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\setup\*.exe" | Select-Object -First 1
          gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA --title "Universal Dashboard Agent $env:RELEASE_TAG" --notes "Draft unsigned Windows x64 release; publish only after clean-machine acceptance." $setup.FullName "$env:RUNNER_TEMP\SHA256SUMS.txt" "$env:RUNNER_TEMP\release-manifest.json"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-dashboard-agent"
version = "0.1.0"
description = "Local Hermes-powered dashboard generation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["dashboard.api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
